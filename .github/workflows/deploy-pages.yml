name: Publish frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "Frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build -- --base=/Home_Appliance_Repair_Service_Center/

      - name: Prepare SPA fallback
        working-directory: Frontend
        run: cp dist/index.html dist/404.html

      - name: Publish site files to the Pages root
        working-directory: Frontend
        run: |
          cp -a dist/. ..
          touch ../.nojekyll
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add -A -- .nojekyll index.html 404.html assets images favicon.svg icons.svg whatsapp-brands-solid-full.svg
          if git -C .. diff --cached --quiet; then
            echo "The published site is already up to date."
          else
            git -C .. commit -m "Publish frontend to GitHub Pages"
            git -C .. push origin HEAD:main
          fi
